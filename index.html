<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>成长森林</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="成长森林">
<style>
  :root{
    --top1:#4db6ac; --top2:#80cbc4; --top3:#b2dfdb;
    --tree:#2e7d32; --leaf:#66bb6a; --mint:#a5d6a7; --mint2:#e8f5e9;
    --wood:#a9824f; --gold:#ffb300; --sun:#ffd54f;
    --panel:#ffffff; --panel2:#f1f8f4; --line:#d7e8dd;
    --ink:#2b3a30; --ink2:#6b7d70; --pink:#ef9a9a;
    --sky:#e0f2f1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--sky);color:var(--ink);overflow-x:hidden}
  .leaf-bg{position:fixed;inset:0;z-index:0;background:
    radial-gradient(700px 380px at 85% -5%, rgba(102,187,106,.18), transparent),
    radial-gradient(600px 360px at 5% 105%, rgba(77,182,172,.16), transparent),
    linear-gradient(180deg,#e8f5f0 0%, #e0f2f1 40%, #e8f5e9 100%);background-attachment:fixed}

  header{position:relative;z-index:2;padding:14px 14px 4px;max-width:560px;margin:0 auto}
  .profile{background:linear-gradient(135deg,var(--top1),var(--top2));border-radius:24px;padding:16px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 16px 34px rgba(27,94,32,.42),0 6px 0 rgba(27,94,32,.12),inset 0 1px 0 rgba(255,255,255,.45);color:#fff;transform:translateY(-2px);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
  .profile::after{content:"";position:absolute;top:0;left:0;right:0;height:42%;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent);pointer-events:none}
  .avatar{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
  .pinfo{flex:1;min-width:0}
  .pname{font-size:17px;font-weight:900;display:flex;align-items:center;gap:6px}
  .grade{font-size:12px;background:rgba(255,255,255,.28);border-radius:10px;padding:2px 9px;font-weight:700;cursor:pointer;border:none;color:#fff}
  .pstats{display:flex;gap:14px;margin-top:8px}
  .pstat{display:flex;flex-direction:column}
  .pstat b{font-size:18px;font-weight:900}
  .pstat span{font-size:11px;opacity:.85}

  nav{position:relative;z-index:2;max-width:560px;margin:12px auto 0;padding:0 14px;display:flex;gap:8px;overflow-x:auto}
  nav button{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:8px 14px;font-size:13.5px;font-weight:800;color:var(--ink2);cursor:pointer;white-space:nowrap;transition:.15s}
  nav button.active{background:var(--tree);color:#fff;border-color:var(--tree);box-shadow:0 3px 0 #1b5e20}

  main{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:12px 14px 90px}

  /* 试炼条 */
  .trial{background:linear-gradient(135deg,#a5d6a7,#80cbc4);border-radius:22px;padding:14px 16px;margin:14px 0;display:flex;align-items:center;gap:10px;box-shadow:0 14px 28px rgba(46,125,50,.34),0 5px 0 rgba(46,125,50,.12),inset 0 1px 0 rgba(255,255,255,.4);position:relative;overflow:hidden;transform:translateY(-1px)}
  .trial::after{content:"";position:absolute;top:0;left:0;right:0;height:42%;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent);pointer-events:none}
  .trial .ic{font-size:26px}
  .trial .tx{flex:1}
  .trial .tx b{font-size:14px;color:var(--ink);font-weight:900}
  .trial .tx div{font-size:12px;color:var(--ink2);margin-top:2px}
  .trial .pg{height:8px;background:rgba(255,255,255,.6);border-radius:6px;margin-top:6px;overflow:hidden}
  .trial .pg i{display:block;height:100%;background:var(--tree);border-radius:6px;transition:width .4s}

  /* 作业清单卡片 */
  .sec-t{font-size:15px;font-weight:900;margin:16px 4px 8px;color:var(--ink);display:flex;align-items:center;gap:6px}
  .subj-group{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:10px 12px 12px;margin-bottom:12px;box-shadow:0 3px 10px rgba(0,0,0,.04)}
  .subj-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:2px dashed var(--mint)}
  .subj-ic{font-size:22px}
  .subj-name{font-size:16px;font-weight:900;flex:1}
  .subj-badge{font-size:12px;font-weight:800;background:var(--leaf);color:#fff;border-radius:10px;padding:2px 9px}
  .mini-del{border:none;background:transparent;font-size:15px;cursor:pointer;padding:2px 4px;flex:none}
  .add-btn{margin-top:10px;border:2px dashed var(--leaf);background:rgba(102,187,106,.12);color:var(--tree);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:800;cursor:pointer;width:100%}
  .add-btn.big{padding:12px;font-size:15px;margin-top:14px}
  .add-btn.danger{border-color:var(--pink);background:rgba(239,154,154,.14);color:#c62828}
  .edit-hint{background:var(--gold);color:#5d4037;text-align:center;font-weight:800;font-size:13px;padding:8px;border-radius:12px;margin:0 0 12px}
  .task-card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 10px rgba(0,0,0,.04)}
  .task-card.done{opacity:.6}
  .task-ic{width:42px;height:42px;border-radius:12px;background:var(--mint2);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
  .task-mid{flex:1;min-width:0}
  .task-mid .tn{font-size:15px;font-weight:800}
  .task-mid .ts{font-size:12px;color:var(--ink2);margin-top:2px}
  .task-check{width:30px;height:30px;border-radius:50%;border:3px solid var(--leaf);flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;cursor:pointer;transition:.15s}
  .task-card.done .task-check{background:var(--leaf);border-color:var(--leaf)}

  /* 花园网格 */
  .garden-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .plot{aspect-ratio:1;border-radius:16px;background:var(--mint2);border:2px dashed var(--mint);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
  .plot.locked{opacity:.5}
  .plot .tree{font-size:40px;line-height:1}
  .plot .plv{position:absolute;top:4px;right:6px;font-size:11px;font-weight:900;background:var(--gold);color:#5d4037;border-radius:8px;padding:1px 6px}
  .plot .pnm{font-size:11px;font-weight:700;margin-top:3px;color:var(--ink2)}
  .plot.locked .lk{font-size:26px;opacity:.5}
  .plot:active{transform:scale(.96)}

  /* 日志 */
  .log-item{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .log-item .li-ic{font-size:20px}
  .log-item .li-tx{flex:1;font-size:13.5px;font-weight:600}
  .log-item .li-tx small{display:block;color:var(--ink2);font-weight:400;font-size:11px}
  .log-item .li-d{font-weight:900;color:var(--tree)}
  .log-item .li-d.minus{color:var(--pink)}

  /* 番茄钟 */
  .pomo{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:20px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.04)}
  .pomo-ring{width:200px;height:200px;margin:0 auto;border-radius:50%;background:conic-gradient(var(--top1) var(--pp,0deg), var(--mint2) 0deg);display:flex;align-items:center;justify-content:center;position:relative}
  .pomo-ring .inner{width:160px;height:160px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center}
  .pomo-time{font-size:42px;font-weight:900;color:var(--tree);font-variant-numeric:tabular-nums}
  .pomo-set{display:flex;gap:8px;justify-content:center;margin:14px 0}
  .pomo-set button{background:var(--mint2);border:2px solid var(--mint);border-radius:12px;padding:7px 14px;font-weight:800;color:var(--tree);cursor:pointer}
  .pomo-set button.on{background:var(--tree);color:#fff;border-color:var(--tree)}
  .pomo-go{width:100%;padding:14px;border:none;border-radius:16px;font-size:17px;font-weight:900;color:#fff;background:var(--tree);box-shadow:0 4px 0 #1b5e20;cursor:pointer;margin-top:6px}
  .pomo-go:active{transform:translateY(3px);box-shadow:none}

  /* 通用按钮网格（首页功能入口） */
  .tools{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
  .tool{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.04)}
  .tool .ti{font-size:26px}
  .tool .tl{font-size:11.5px;font-weight:700;margin-top:4px;color:var(--ink2)}

  .empty{text-align:center;color:var(--ink2);padding:24px;font-size:13px;font-weight:600}

  .fab{position:fixed;z-index:5;bottom:14px;right:14px;display:flex;gap:10px}
  .fab button{width:52px;height:52px;border-radius:50%;border:3px solid #fff;font-size:22px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.15);transition:.12s}
  .fab .sync{background:var(--sun);color:#5d4037}
  .fab .reset{background:var(--pink);color:#fff;font-size:16px}

  .overlay{position:fixed;inset:0;z-index:20;background:rgba(30,50,40,.5);display:none;align-items:center;justify-content:center}
  .overlay.show{display:flex;animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{width:min(360px,92vw);background:var(--panel);border-radius:22px;padding:20px;box-shadow:0 8px 0 rgba(0,0,0,.12)}
  .modal h3{margin:0 0 12px;font-size:17px;font-weight:900;color:var(--ink)}
  .modal textarea{width:100%;height:100px;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px;font-size:12px;font-family:monospace;resize:none}
  .modal .row{display:flex;gap:10px;margin-top:12px}
  .modal .row button{flex:1;padding:11px;border:none;border-radius:12px;font-weight:800;cursor:pointer;font-size:14px}
  .btn-p{background:var(--tree);color:#fff}
  .btn-g{background:var(--panel2);color:var(--ink2);border:2px solid var(--line)!important}
  .modal .tip{font-size:11px;color:var(--ink2);margin-top:8px;line-height:1.6;font-weight:600}
  .toast{position:fixed;z-index:30;left:50%;top:16px;transform:translateX(-50%);background:var(--tree);color:#fff;padding:10px 18px;border-radius:22px;font-weight:800;font-size:13px;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1;top:26px}
  .edit-tip{background:var(--gold);color:#5d4037;text-align:center;font-weight:800;font-size:13px;padding:8px;border-radius:12px;margin:0 0 10px}
</style>
</head>
<body>
<div class="leaf-bg"></div>

<header>
  <div class="profile">
    <div class="avatar">🌳</div>
    <div class="pinfo">
      <div class="pname">成长森林 <button class="grade" id="grade-btn">五年级 ▾</button></div>
      <div class="pstats">
        <div class="pstat"><b id="s-sun">0</b><span>🌞 阳光</span></div>
        <div class="pstat"><b id="s-streak">0</b><span>🔥 连续天</span></div>
        <div class="pstat"><b id="s-rate">0%</b><span>今日完成</span></div>
      </div>
    </div>
  </div>
</header>

<nav id="nav">
  <button data-tab="home" class="active">🏠 首页</button>
  <button data-tab="garden">🌳 森林</button>
  <button data-tab="pomo">⏱️ 番茄钟</button>
  <button data-tab="log">📖 日志</button>
  <button data-tab="book">🌿 图鉴</button>
  <button data-tab="evo">✨ 试炼</button>
  <button id="btn-edit">✏️ 家长</button>
</nav>

<main>
  <div id="tab-home"></div>
  <div id="tab-garden" style="display:none"></div>
  <div id="tab-pomo" style="display:none"></div>
  <div id="tab-log" style="display:none"></div>
  <div id="tab-book" style="display:none"></div>
  <div id="tab-evo" style="display:none"></div>
</main>

<div class="fab">
  <button class="reset" id="btn-reset" title="重置">🗑️</button>
  <button class="sync" id="btn-sync" title="同步">🔄</button>
</div>

<!-- 家长密码弹窗 -->
<div class="overlay" id="ov-pwd">
  <div class="modal" style="text-align:center">
    <h3>🔒 家长验证</h3>
    <p style="font-size:12.5px;color:var(--ink2);font-weight:700;margin:0 0 12px">请输入家长密码才能编辑目录</p>
    <input id="pwd-input" type="password" inputmode="numeric" placeholder="默认 1234" style="width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;font-size:16px;text-align:center;font-family:inherit">
    <div id="pwd-err" style="color:#ef5350;font-size:12px;font-weight:700;min-height:18px;margin-top:6px"></div>
    <div class="row">
      <button class="btn-g" id="pwd-cancel">取消</button>
      <button class="btn-p" id="pwd-ok">进入编辑</button>
    </div>
  </div>
</div>

<!-- 同步弹窗 -->
<div class="overlay" id="ov-sync">
  <div class="modal">
    <h3>🔄 存档同步</h3>
    <p style="font-size:12.5px;color:var(--ink2);margin:0 0 8px;font-weight:700">导出存档文本，到另一台设备粘贴导入</p>
    <button class="btn-p" id="gen-qr" style="width:100%">生成我的存档</button>
    <div id="qr-box" style="display:none;text-align:center;margin-top:12px">
      <textarea id="export-text" readonly style="height:80px"></textarea>
      <button class="btn-g" id="copy-text" style="width:100%;margin-top:8px">📋 复制存档文本</button>
    </div>
    <hr style="border-color:var(--line);margin:16px 0">
    <p style="font-size:12.5px;color:var(--ink2);margin:0 0 8px;font-weight:700">导入存档（粘贴对方文本）</p>
    <textarea id="import-text" placeholder="在此粘贴存档文本…"></textarea>
    <div class="row">
      <button class="btn-g" id="close-sync">关闭</button>
      <button class="btn-p" id="do-import">导入</button>
    </div>
  </div>
</div>

<!-- 年级选择弹窗 -->
<div class="overlay" id="ov-grade">
  <div class="modal">
    <h3>🎓 选择年级</h3>
    <div id="grade-list" style="display:flex;flex-direction:column;gap:8px;margin-top:6px"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== 数据 ===== */
const SUN_PER_TASK = 10;
const EDIT_PWD = "1234";
const GRADES = ["大班","一年级","二年级","三年级","四年级","五年级","六年级","初一","初二","初三"];
const SUBJECTS = [
  {key:"yuwen", name:"语文", icon:"📖", tasks:["拼音练习","生字抄写","课文朗读","古诗背诵","看图写话"]},
  {key:"shuxue", name:"数学", icon:"🔢", tasks:["口算训练","认识图形","应用题","钟表认识","分类与比较"]},
  {key:"yingyu", name:"英语", icon:"🔤", tasks:["单词跟读","儿歌吟唱","字母书写"]},
  {key:"daka", name:"每日打卡", icon:"🌿", tasks:["晨读 15 分钟","围棋 1 局","户外运动","亲子阅读","练字 10 分钟"]},
];
const TREES = ["🌲","🌳","🌴","🌵","🌲","🌳","🍀","🌿","🌱","🌲"];
const EVO_PLANTS = [
  {lv:2, name:"坚盾果", need:50, ic:"🛡️"},
  {lv:3, name:"蔷薇花", need:100, ic:"🌹"},
  {lv:4, name:"凤凰木", need:160, ic:"🔥"},
  {lv:5, name:"世界树", need:230, ic:"🌍"},
];

/* ===== 状态 ===== */
const STORE_KEY = "chengzhang_forest_v1";
const TREE_ICONS = ["🌳","🌲","🌴","🌵","🍀","🌿"];
let state = load();
function todayStr(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function dateDiff(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(STORE_KEY));
    if(s && s.done!==undefined){
      if(!s.subjects) s.subjects=clone(DEFAULT_SUBJECTS());
      if(!s.days) s.days={};
      if(s.streak===undefined) s.streak=0;
      if(!s.lastDay) s.lastDay=null;
      if(!s.history) s.history={};
      if(!s.log) s.log=[];
      if(!s.grade) s.grade="五年级";
      if(!s.plots) s.plots=[];
      dailyReset(s);
      return s;
    }
  }catch(e){}
  return newState();
}
function DEFAULT_SUBJECTS(){return SUBJECTS.map(s=>({key:s.key,name:s.name,icon:s.icon,tasks:s.tasks.map((n,i)=>({id:s.key+i,n}))}));}
function newState(){return {done:{},plants:[],evo:[],subjects:DEFAULT_SUBJECTS(),days:{},streak:0,lastDay:null,history:{},log:[],grade:"五年级",plots:[],pwdSet:false};}
function clone(o){return JSON.parse(JSON.stringify(o));}
/* 当天作业数据：每天一份可编辑副本，基于模板 subjects 生成 */
function ensureToday(){
  const t=todayStr();
  if(!state.days[t]){
    // 旧版本迁移：把全局 done 迁到今天，避免原有进度丢失
    const migrate = state.done && Object.keys(state.done).length ? state.done : {};
    state.days[t]={subjects:clone(state.subjects), done:migrate};
    state.done={};
    save();
  }
  return state.days[t];
}
function todayData(){ return ensureToday(); }
function getSubjects(){ return todayData().subjects; }
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state));}
function genId(){return "t"+Date.now().toString(36)+Math.floor(Math.random()*999);}
function allTasks(){return getSubjects().flatMap(s=>s.tasks.map(t=>({...t,subj:s.name,icon:s.icon})));}
function doneCount(){const d=todayData().done;return Object.values(d).filter(Boolean).length;}
function sunCount(){return doneCount()*SUN_PER_TASK;}
function plantCount(){return state.plants.length;}

/* 每日处理：跨天时计算连续天数，当天作业副本由 ensureToday 生成 */
function dailyReset(s){
  const t=todayStr();
  if(s.lastDay===t) return;
  let gap=s.lastDay?dateDiff(s.lastDay,t):999;
  const lastDay=s.lastDay&&s.days[s.lastDay];
  const lastDone=lastDay&&Object.values(lastDay.done).some(Boolean);
  if(s.lastDay&&gap===1&&lastDone) s.streak=(s.streak||0)+1; else s.streak=0;
  s.lastDay=t;
  if(!s.history[t]) s.history[t]={done:0,sun:0};
}
function logEvent(text, delta){
  state.log.unshift({time:Date.now(), text, delta});
  if(state.log.length>200) state.log.pop();
}
function addSun(n, reason){ state.done; /* 阳光通过 done 计算，不单独存 */ }
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600);}

/* ===== 音效 ===== */
let actx=null;
function ac(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return actx;}
function beep(f,dur,type="triangle",vol=0.15,when=0){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(c.destination);const tt=c.currentTime+when;g.gain.setValueAtTime(vol,tt);g.gain.exponentialRampToValueAtTime(0.0001,tt+dur);o.start(tt);o.stop(tt+dur);}
function sfxDone(){beep(660,0.1,"triangle",0.18,0);beep(880,0.12,"triangle",0.18,0.09);}
function sfxSun(){beep(880,0.09,"sine",0.14,0);beep(1175,0.11,"sine",0.14,0.07);}
function sfxEvo(){beep(659,0.13,"triangle",0.2,0);beep(880,0.13,"triangle",0.2,0.12);beep(1047,0.2,"triangle",0.2,0.24);}
function sfxPomo(){beep(523,0.15,"sine",0.2,0);beep(784,0.2,"sine",0.2,0.12);}
document.addEventListener("pointerdown",()=>{const c=ac();if(c&&c.state==="suspended")c.resume();},{once:true});

/* ===== 渲染 ===== */
function renderTop(){
  document.getElementById("s-sun").textContent=totalSun();
  document.getElementById("s-streak").textContent=state.streak||0;
  const total=allTasks().length, done=doneCount();
  document.getElementById("s-rate").textContent= total? Math.round(done/total*100)+"%" : "0%";
  document.getElementById("grade-btn").textContent=state.grade+" ▾";
  // 试炼进度
  const pg=document.getElementById("trial-pg");
  if(pg) pg.style.width=Math.min(100,Math.round(sunCount()/50*100))+"%";
}
function renderHome(){
  const el=document.getElementById("tab-home");
  let html = EDIT_MODE ? `<div class="edit-hint">✏️ 家长编辑：点科目名/事项名可改名，🗑️ 删除，下方按钮可加科目/事项</div>` : ``;
  html+=`<div class="trial"><div class="ic">🌟</div><div class="tx"><b>森林试炼</b><div>累计 ${sunCount()} 阳光，离下一阶段还差 ${Math.max(0,50-sunCount()%50)}</div><div class="pg"><i id="trial-pg" style="width:${Math.min(100,Math.round(sunCount()/50*100))}%"></i></div></div></div>`;
  html+=`<div class="sec-t">📋 今日作业</div>`;
  getSubjects().forEach((s,si)=>{
    const total=s.tasks.length;
    const done=s.tasks.filter(t=>todayData().done[t.id]).length;
    const headEdit = EDIT_MODE
      ? `<button class="mini-del" data-act="delsubj" data-s="${si}" title="删除科目">🗑️</button>`
      : ``;
    html+=`<div class="subj-group">
      <div class="subj-head"><span class="subj-ic">${s.icon}</span><span class="subj-name" ${EDIT_MODE?`data-renames="${si}"`:''}>${s.name}</span><span class="subj-badge">${done}/${total}</span>${headEdit}</div>`;
    s.tasks.forEach(t=>{
      const d=todayData().done[t.id];
      const itemEdit = EDIT_MODE
        ? `<button class="mini-del" data-act="deltask" data-s="${si}" data-t="${t.id}" title="删除">🗑️</button>`
        : ``;
      html+=`<div class="task-card ${d?'done':''}" data-id="${t.id}">
        <div class="task-ic">${s.icon}</div>
        <div class="task-mid"><div class="tn" ${EDIT_MODE?`data-renamet="${t.id}"`:''}>${t.n}</div><div class="ts">+${SUN_PER_TASK}🌞</div></div>
        <div style="display:flex;align-items:center;gap:6px">${itemEdit}<div class="task-check" data-id="${t.id}">${d?'✓':''}</div></div>
      </div>`;
    });
    if(EDIT_MODE){
      html+=`<button class="add-btn" data-act="addtask" data-s="${si}">＋ 添加事项</button>`;
    }
    html+=`</div>`;
  });
  if(EDIT_MODE){
    html+=`<button class="add-btn big" data-act="addsubj">＋ 添加新科目</button>`;
    html+=`<button class="add-btn big" data-act="savetpl">💾 存为每日模板</button>`;
    html+=`<button class="add-btn big danger" data-act="reset">↺ 恢复今天的默认</button>`;
  }
  html+=`<div class="sec-t">🛠️ 小工具</div><div class="tools">
    <div class="tool" data-go="garden"><div class="ti">🌳</div><div class="tl">森林</div></div>
    <div class="tool" data-go="pomo"><div class="ti">⏱️</div><div class="tl">番茄钟</div></div>
    <div class="tool" data-go="book"><div class="ti">🌿</div><div class="tl">图鉴</div></div>
    <div class="tool" data-go="log"><div class="ti">📖</div><div class="tl">日志</div></div>
  </div>`;
  el.innerHTML=html;
  el.querySelectorAll(".task-check").forEach(c=>c.onclick=()=>toggleTask(c.dataset.id));
  el.querySelectorAll(".tool").forEach(t=>t.onclick=()=>switchTab(t.dataset.go));
  if(EDIT_MODE){
    el.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>handleEdit(b.dataset.act,+b.dataset.s,b.dataset.t));
    el.querySelectorAll("[data-renamet]").forEach(n=>n.onclick=()=>{const id=n.dataset.renamet;const tk=allTasks().find(x=>x.id===id);const nv=prompt("修改作业名称：",tk.n);if(nv){const sub=getSubjects().find(s=>s.tasks.some(x=>x.id===id));sub.tasks.find(x=>x.id===id).n=nv;save();renderHome();toast("已改名");}});
    el.querySelectorAll("[data-renames]").forEach(n=>n.onclick=()=>{const si=+n.dataset.renames;const nv=prompt("修改科目名称：",getSubjects()[si].name);if(nv){getSubjects()[si].name=nv;save();renderHome();toast("已改名");}});
  }
}
function toggleTask(id){
  const d=todayData().done;
  if(d[id]){ d[id]=false; }
  else{
    d[id]=true;
    const t=allTasks().find(x=>x.id===id);
    sfxDone(); sfxSun();
    logEvent(`完成了「${t.subj}·${t.n}」`, SUN_PER_TASK);
    // 种一棵植物到森林（自动找空位）
    plantTree(t.n);
    // 进化检查
    checkEvo();
  }
  save(); renderTop(); renderHome(); renderGarden(); renderBook(); renderEvo();
}
function plantTree(name){
  if(state.plots.length>=12) return; // 满12格
  state.plots.push({tree:TREE_ICONS[state.plots.length%TREE_ICONS.length], name, lv:1});
  logEvent(`在森林种下了「${name}」`, 0);
}
function checkEvo(){
  const res=[];
  for(const e of EVO_PLANTS){
    if(sunCount()>=e.need && !state.evo.some(x=>x.lv===e.lv)){
      state.evo.push({lv:e.lv,name:e.name,ic:e.ic});
      res.push(e);
    }
  }
  if(res.length) sfxEvo();
  return res;
}
function renderGarden(){
  const el=document.getElementById("tab-garden");
  const total=12;
  let html=`<div class="sec-t">🌳 我的森林 <small style="color:var(--ink2);font-weight:600">(${state.plots.length}/${total})</small></div>`;
  html+=`<div class="garden-grid">`;
  for(let i=0;i<total;i++){
    if(i<state.plots.length){
      const p=state.plots[i];
      html+=`<div class="plot" data-i="${i}"><div class="plv">Lv.${p.lv}</div><div class="tree">${p.tree}</div><div class="pnm">${p.name}</div></div>`;
    }else{
      html+=`<div class="plot locked"><div class="lk">🔒</div><div class="pnm">完成事项解锁</div></div>`;
    }
  }
  html+=`</div><div class="empty" style="margin-top:14px">每完成一项作业，森林就长高一棵 🌱</div>`;
  el.innerHTML=html;
}
function renderLog(){
  const el=document.getElementById("tab-log");
  if(!state.log.length){el.innerHTML=`<div class="empty">还没有记录哦～完成作业就会出现在这里</div>`;return;}
  let html=`<div class="sec-t">📖 事件日志</div>`;
  state.log.forEach(l=>{
    const d=new Date(l.time);
    const hm=`${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const sign=l.delta>0?`+${l.delta}🌞`:(l.delta<0?`${l.delta}🌞`:'');
    const cls=l.delta>0?'':(l.delta<0?'minus':'');
    html+=`<div class="log-item"><div class="li-ic">${l.delta>0?'🌟':(l.delta<0?'💤':'🌿')}</div><div class="li-tx">${l.text}<small>${hm}</small></div><div class="li-d ${cls}">${sign}</div></div>`;
  });
  el.innerHTML=html;
}
function renderBook(){
  const el=document.getElementById("tab-book");
  let html=`<div class="sec-t">🌿 植物图鉴 <small style="color:var(--ink2);font-weight:600">(${state.plants.length} 棵)</small></div><div class="garden-grid">`;
  state.plants.forEach((p,i)=>{const t=TREE_ICONS[i%TREE_ICONS.length];html+=`<div class="plot"><div class="tree">${t}</div><div class="pnm">${p.name||'植物'}</div></div>`;});
  html+=`</div>`;
  if(state.evo.length){
    html+=`<div class="sec-t">✨ 进化植物</div><div class="garden-grid">`;
    state.evo.forEach(e=>html+=`<div class="plot" style="border-color:var(--gold)"><div class="plv">Lv.${e.lv}</div><div class="tree">${e.ic}</div><div class="pnm">${e.name}</div></div>`);
    html+=`</div>`;
  }
  el.innerHTML=html;
}
function renderEvo(){
  const el=document.getElementById("tab-evo");
  let html=`<div class="sec-t">✨ 森林试炼</div><div style="font-size:13px;color:var(--ink2);font-weight:600;margin:4px">累计阳光越多，森林越繁荣！</div><div class="garden-grid">`;
  EVO_PLANTS.forEach(e=>{
    const got=state.evo.some(x=>x.lv===e.lv), reach=sunCount()>=e.need;
    html+=`<div class="plot" style="${got?'border-color:var(--gold)':(reach?'border-color:var(--leaf)':'')}"><div class="plv">Lv.${e.lv}</div><div class="tree">${got||reach?e.ic:'❔'}</div><div class="pnm">${e.name}</div><div class="pnm" style="color:var(--ink2);font-weight:700;font-size:10px">需 ${e.need}🌞</div></div>`;
  });
  html+=`</div>`;
  el.innerHTML=html;
}

/* 番茄钟 */
let pomoTimer=null, pomoLeft=0, pomoTotal=25*60;
function renderPomo(){
  const el=document.getElementById("tab-pomo");
  const mm=String(Math.floor(pomoLeft/60)).padStart(2,'0'), ss=String(pomoLeft%60).padStart(2,'0');
  const deg=pomoTotal? (pomoLeft/pomoTotal*360):0;
  const mins=[15,20,25,30,45];
  let setHtml=mins.map(m=>`<button data-m="${m}" class="${m*60===pomoTotal?'on':''}">${m}分</button>`).join("");
  el.innerHTML=`<div class="sec-t">⏱️ 番茄钟</div>
    <div class="pomo">
      <div class="pomo-ring" style="--pp:${deg}deg"><div class="inner"><div class="pomo-time" id="pomo-time">${mm}:${ss}</div><div style="font-size:12px;color:var(--ink2)">专注计时</div></div></div>
      <div class="pomo-set">${setHtml}</div>
      <button class="pomo-go" id="pomo-go">${pomoTimer?'⏸️ 暂停':'▶️ 开始专注'}</button>
    </div>
    <div class="empty">完成一次专注，森林获得 +20🌞 与连续打卡保护</div>`;
  el.querySelectorAll(".pomo-set button").forEach(b=>b.onclick=()=>{ if(pomoTimer)return; pomoTotal=b.dataset.m*60; pomoLeft=pomoTotal; renderPomo(); });
  document.getElementById("pomo-go").onclick=()=>{
    if(pomoTimer){clearInterval(pomoTimer);pomoTimer=null;renderPomo();return;}
    if(pomoLeft<=0)pomoLeft=pomoTotal;
    pomoTimer=setInterval(()=>{
      pomoLeft--;
      const mm=String(Math.floor(pomoLeft/60)).padStart(2,'0'),ss=String(pomoLeft%60).padStart(2,'0');
      const t=document.getElementById("pomo-time"); if(t)t.textContent=`${mm}:${ss}`;
      const ring=document.querySelector(".pomo-ring"); if(ring) ring.style.setProperty("--pp",(pomoLeft/pomoTotal*360)+"deg");
      if(pomoLeft<=0){
        clearInterval(pomoTimer);pomoTimer=null;
        sfxPomo();
        logEvent("完成一次番茄钟专注", 20);
        // 番茄钟也给阳光：通过标记一个隐藏完成，这里直接加 sun 不易，改用 log+提示
        toast("专注完成！+20🌞 已记录");
        pomoLeft=pomoTotal; renderPomo(); save();
      }
    },1000);
    renderPomo();
  };
}
// 番茄钟的+20阳光：用 done 无法表示，这里用一个虚拟任务记录到 history 但不进作业。简化：累计阳光=作业阳光+番茄*20
function tomatoSun(){ return Math.round(state.log.filter(l=>l.text.includes("番茄钟")).length*20); }

/* ===== tab 切换 ===== */
function switchTab(tab){
  document.querySelectorAll("#nav button[data-tab]").forEach(x=>x.classList.remove("active"));
  const btn=document.querySelector(`#nav button[data-tab="${tab}"]`); if(btn)btn.classList.add("active");
  ["home","garden","pomo","log","book","evo"].forEach(t=>{
    document.getElementById("tab-"+t).style.display = t===tab?"block":"none";
  });
  if(tab==="garden")renderGarden();
  if(tab==="log")renderLog();
  if(tab==="book")renderBook();
  if(tab==="evo")renderEvo();
  if(tab==="pomo")renderPomo();
}
document.querySelectorAll("#nav button[data-tab]").forEach(b=>{
  if(b.id==="btn-edit")return;
  b.onclick=()=>switchTab(b.dataset.tab);
});

/* ===== 家长编辑 ===== */
let EDIT_MODE=false;
function toggleEdit(){
  if(EDIT_MODE){EDIT_MODE=false;document.getElementById("btn-edit").textContent="✏️ 家长";document.getElementById("btn-edit").classList.remove("on");renderHome();return;}
  const pw=document.getElementById("pwd-input").value.trim();
  if(pw===EDIT_PWD){EDIT_MODE=true;document.getElementById("btn-edit").textContent="✅ 完成";document.getElementById("btn-edit").classList.add("on");document.getElementById("ov-pwd").classList.remove("show");document.getElementById("pwd-input").value="";toast("进入家长编辑");renderHome();}
  else{document.getElementById("pwd-err").textContent=pw?"密码不对，试试 1234":"请输入家长密码（默认 1234）";}
}
document.getElementById("btn-edit").onclick=()=>{
  if(EDIT_MODE){ toggleEdit(); return; }   // 编辑中：直接退出
  document.getElementById("pwd-input").value="";
  document.getElementById("pwd-err").textContent="";
  document.getElementById("ov-pwd").classList.add("show");
  document.getElementById("pwd-input").focus();
};
document.getElementById("pwd-ok").onclick=toggleEdit;
document.getElementById("pwd-cancel").onclick=()=>document.getElementById("ov-pwd").classList.remove("show");
document.getElementById("pwd-input").addEventListener("keydown",e=>{if(e.key==="Enter")toggleEdit();});

function handleEdit(act, si, tid){
  const subs=getSubjects();
  const done=todayData().done;
  if(act==="addtask"){
    subs[si].tasks.push({id:genId(), n:"新事项"});
    save(); renderHome(); toast("已添加事项（仅今天），点名称可改名");
  }else if(act==="deltask"){
    const tk=subs[si].tasks.find(x=>x.id===tid);
    if(tk && done[tid]){ if(!confirm("这项已完成，删除会扣回进度，确定？")) return; }
    subs[si].tasks=subs[si].tasks.filter(x=>x.id!==tid);
    delete done[tid];
    save(); renderHome(); toast("已删除事项（仅今天）");
  }else if(act==="addsubj"){
    const icons=["📖","🔢","🔤","🌿","🎹","🏊","🎨","⚽","🎵","🧩","🌟","📝"];
    subs.push({key:genId(), name:"新科目", icon:icons[subs.length%icons.length], tasks:[{id:genId(), n:"新事项"}]});
    save(); renderHome(); toast("已添加科目（仅今天）");
  }else if(act==="delsubj"){
    const cnt=subs[si].tasks.filter(t=>done[t.id]).length;
    if(cnt>0 && !confirm("该科目有已完成项，删除会扣回进度，确定？")) return;
    subs[si].tasks.forEach(t=>delete done[t.id]);
    subs.splice(si,1);
    save(); renderHome(); toast("已删除科目（仅今天）");
  }else if(act==="reset"){
    if(!confirm("将把今天的作业重置为默认模板，你今天的增删改都会撤销，确定？")) return;
    state.days[todayStr()]={subjects:clone(state.subjects), done:{}};
    save(); renderHome(); toast("已恢复今天的默认作业");
  }else if(act==="savetpl"){
    if(!confirm("把今天编辑后的作业保存为每天模板？之后每天都会按此生成（不影响今天之前的历史）。")) return;
    state.subjects=clone(subs);
    save(); renderHome(); toast("已保存为每日模板");
  }
}

/* ===== 年级选择 ===== */
function renderGradeList(){
  const box=document.getElementById("grade-list");
  box.innerHTML=GRADES.map(g=>`<button class="btn-g" data-g="${g}" style="text-align:left;padding:10px 14px;${g===state.grade?'background:var(--mint2);border-color:var(--leaf)!important':''}">${g}</button>`).join("");
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{state.grade=b.dataset.g;save();document.getElementById("grade-btn").textContent=state.grade+" ▾";document.getElementById("ov-grade").classList.remove("show");toast("年级设为 "+state.grade);});
}
document.getElementById("grade-btn").onclick=()=>{renderGradeList();document.getElementById("ov-grade").classList.add("show");};

/* ===== 重置/同步 ===== */
document.getElementById("btn-reset").onclick=()=>{if(confirm("确定清空所有进度吗？森林会重新种下哦！")){state=newState();save();renderAll();toast("进度已重置");}};
document.getElementById("btn-sync").onclick=()=>{document.getElementById("qr-box").style.display="none";document.getElementById("ov-sync").classList.add("show");};
document.getElementById("close-sync").onclick=()=>document.getElementById("ov-sync").classList.remove("show");
let lastExport="";
document.getElementById("gen-qr").onclick=()=>{lastExport=btoa(unescape(encodeURIComponent(JSON.stringify(state))));document.getElementById("export-text").value=lastExport;document.getElementById("qr-box").style.display="block";};
document.getElementById("copy-text").onclick=()=>{navigator.clipboard?.writeText(lastExport).then(()=>toast("已复制存档文本")).catch(()=>{const ta=document.getElementById("export-text");ta.select();document.execCommand("copy");toast("已复制");});};
document.getElementById("do-import").onclick=()=>{const txt=document.getElementById("import-text").value.trim();if(!txt){toast("请先粘贴存档文本");return;}try{const s=JSON.parse(decodeURIComponent(escape(atob(txt))));if(s&&s.done){if(!confirm("导入将覆盖当前进度，确定吗？"))return;state=s;save();renderAll();document.getElementById("ov-sync").classList.remove("show");toast("存档导入成功！");}}catch(e){toast("存档解析失败");}};

/* 番茄钟阳光合并到总阳光显示 */
function totalSun(){ return sunCount()+tomatoSun(); }

/* ===== 总渲染 ===== */
function renderAll(){
  // 用 totalSun 覆盖显示
  renderTop();
  // 顶部阳光显示含番茄
  document.getElementById("s-sun").textContent=totalSun();
  renderHome();renderGarden();renderBook();renderEvo();
}

/* ===== 启动 ===== */
renderAll();

/* PWA */
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
